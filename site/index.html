<script>
document.addEventListener('DOMContentLoaded', () => {
  const idMap = { 
    'водоп’ян': 'vodopian', 'денисюк': 'denysiuk', 'кишкіна': 'kyshkina', 
    'копичинський': 'kopychynskyi', 'нагірняк': 'nahirniak', 'поспелова': 'pospelova', 
    'цебро': 'tsebro', 'янішина': 'yanishyna' 
  };
  
  window.eventPhotosArray = [];
  window.finalistPhotosArray = [];
  window.profilePhotos = {};
  Object.values(idMap).forEach(id => window.profilePhotos[id] = []);

  // 1. ФУНКЦІЯ РЕНДЕРУ ГОЛОВНОЇ ГАЛЕРЕЇ
  const renderGrid = (photoArray, arrayName) => {
    const photoGrid = document.querySelector('[data-panel="photos"] [data-photo-grid]');
    const emptyState = document.querySelector('[data-panel="photos"] .pu-empty-state') || document.querySelector('[data-panel="photos"] div:first-child');
    
    if (!photoGrid) return;
    photoGrid.innerHTML = '';
    if (photoArray.length === 0) {
       if (emptyState && !emptyState.hasAttribute('data-photo-grid')) emptyState.removeAttribute('hidden');
       photoGrid.setAttribute('hidden', '');
    } else {
       if (emptyState && !emptyState.hasAttribute('data-photo-grid')) emptyState.setAttribute('hidden', '');
       photoGrid.removeAttribute('hidden');
       photoArray.forEach((p, i) => {
         photoGrid.innerHTML += `
           <button type="button" onclick="openLightbox('${p.url}', '${arrayName}', ${i});" style="display:block; padding:0; background:transparent; border-radius:22px; overflow:hidden; border:none; cursor:pointer;">
             <img src="${p.url}" alt="Фото ${i+1}" style="width:100%; height:100%; object-fit:cover; display:block; border-radius:22px;">
           </button>
         `;
       });
    }
  };

  const updateMainGallery = () => {
     const tabs = document.querySelectorAll('[data-panel="photos"] .pu-album-tabs .pu-tab');
     if (tabs.length >= 2) {
         if (tabs[0].getAttribute('aria-pressed') === 'true') renderGrid(window.eventPhotosArray, 'eventPhotosArray');
         else renderGrid(window.finalistPhotosArray, 'finalistPhotosArray');
     } else {
         renderGrid(window.eventPhotosArray, 'eventPhotosArray'); 
     }
  };

  // 2. ФУНКЦІЯ РЕНДЕРУ ФОТО В ПРОФІЛЯХ
  const updateProfilePhotos = () => {
     const profilePanel = document.querySelector('[data-tab-panel="photo"]');
     const nameEl = document.querySelector('[data-person-name]');
     
     if(!profilePanel || !nameEl) return;
     
     const nameText = nameEl.textContent.toLowerCase();
     let currentId = null;
     for(let [lastName, id] of Object.entries(idMap)) {
         if(nameText.includes(lastName)) currentId = id;
     }
     
     if(currentId) {
        const pPhotos = window.profilePhotos[currentId] || [];
        window.currentProfileArray = pPhotos;
        
        const nativeImg = profilePanel.querySelector('[data-full-photo]');
        if(nativeImg) nativeImg.style.display = 'none';
        const nativeControls = profilePanel.querySelector('.pu-person-photo-controls');
        if(nativeControls) nativeControls.style.display = 'none';
        
        const photoArea = profilePanel.querySelector('.pu-photo-area');
        if(!photoArea) return;

        let customGrid = profilePanel.querySelector('#pu-custom-profile-grid');
        if (!customGrid) {
            customGrid = document.createElement('div');
            customGrid.id = 'pu-custom-profile-grid';
            customGrid.style.display = 'grid';
            customGrid.style.gridTemplateColumns = 'repeat(2, 1fr)';
            customGrid.style.alignContent = 'start';
            customGrid.style.gap = '20px';
            customGrid.style.height = '100%';
            customGrid.style.overflowY = 'auto';
            customGrid.style.paddingBottom = '20px';
            photoArea.appendChild(customGrid);
        }
        
        if(pPhotos.length === 0) {
           customGrid.innerHTML = '<p class="pu-caption">Фотографій поки немає</p>';
        } else {
           customGrid.innerHTML = '';
           pPhotos.forEach((p, i) => {
             customGrid.innerHTML += `
               <button type="button" onclick="openLightbox('${p.url}', 'currentProfileArray', ${i});" style="display:block; padding:0; background:transparent; border-radius:22px; overflow:hidden; border:none; cursor:pointer; aspect-ratio: 4/3;">
                 <img src="${p.url}" alt="Фото" style="width:100%; height:100%; object-fit:cover; display:block;">
               </button>
             `;
           });
        }
     }
  };

  // 3. АВТОМАТИЧНЕ ЗАВАНТАЖЕННЯ
  const fetchPhotos = async () => {
    try {
      const res = await fetch("https://pershyi-urok-support.obakhurinskyi.workers.dev/api/photos");
      const photos = await res.json(); 
      
      const newEventPhotos = [];
      const newFinalistPhotos = [];
      const newProfilePhotos = {};
      Object.values(idMap).forEach(id => newProfilePhotos[id] = []);

      photos.forEach(photo => {
        let isFinalist = false;
        for (const [lastName, id] of Object.entries(idMap)) {
          if (photo.name.includes(id) || photo.name.includes(lastName.replace('’',''))) {
            newProfilePhotos[id].push(photo);
            newFinalistPhotos.push(photo);
            isFinalist = true;
            break;
          }
        }
        if (!isFinalist) newEventPhotos.push(photo);
      });

      window.eventPhotosArray = newEventPhotos;
      window.finalistPhotosArray = newFinalistPhotos;
      window.profilePhotos = newProfilePhotos;

      updateMainGallery();
      updateProfilePhotos();
      
    } catch (e) {
      console.error("Не вдалося завантажити фото", e);
    }
  };

  // 4. ПРИВ'ЯЗКА ПАНЕЛЕЙ
  window.openLightbox = function(url, arrayName, index) {
    const lightbox = document.querySelector('[data-event-lightbox]');
    const image = lightbox.querySelector('[data-event-image]');
    const countDisplay = lightbox.querySelector('[data-photo-count]');
    
    window.currentLightboxArray = window[arrayName] || [];
    window.currentLightboxIndex = index;
    
    image.src = url;
    if(countDisplay && window.currentLightboxArray.length > 0) {
      countDisplay.textContent = `${index + 1} з ${window.currentLightboxArray.length}`;
    }
    lightbox.removeAttribute('hidden');
  };

  const gallerySection = document.querySelector('[data-panel="photos"]');
  if (gallerySection) {
    const tabs = gallerySection.querySelectorAll('.pu-album-tabs .pu-tab');
    if (tabs.length >= 2) {
      tabs[0].addEventListener('click', () => renderGrid(window.eventPhotosArray, 'eventPhotosArray'));
      tabs[1].addEventListener('click', () => renderGrid(window.finalistPhotosArray, 'finalistPhotosArray'));
    }
    const galleryObserver = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.attributeName === 'hidden' && !gallerySection.hasAttribute('hidden')) {
          updateMainGallery();
        }
      });
    });
    galleryObserver.observe(gallerySection, { attributes: true });
  }

  const photoPanel = document.querySelector('[data-tab-panel="photo"]');
  if (photoPanel) {
      const panelObserver = new MutationObserver((mutations) => {
          mutations.forEach(mutation => {
              if (mutation.attributeName === 'hidden' && !photoPanel.hasAttribute('hidden')) {
                  updateProfilePhotos();
              }
          });
      });
      panelObserver.observe(photoPanel, { attributes: true });
  }

  const nameEl = document.querySelector('[data-person-name]');
  if (nameEl) {
      const observer = new MutationObserver(updateProfilePhotos);
      observer.observe(nameEl, { childList: true, characterData: true, subtree: true });
  }

  // 5. ЧЕРГУВАННЯ ФОТО НА ЗАСТАВЦІ (Гарантований показ усіх фіналістів)
  const attractImage = document.querySelector('[data-attract-image]');
  const attractName = document.querySelector('[data-attract-name]');
  const attractKind = document.querySelector('[data-attract-kind]');
  const attractHeading = document.querySelector('.pu-attract-heading');

  if (attractImage) {
      let isOurMutation = false;
      let attractTimeout;

      // Додаємо плавний перехід для зникнення/появи тексту
      if(attractName) attractName.style.transition = 'opacity 0.4s';
      if(attractKind) attractKind.style.transition = 'opacity 0.4s';
      if(attractHeading) attractHeading.style.transition = 'opacity 0.4s';

      const attractObserver = new MutationObserver(() => {
          if (isOurMutation) return; 

          // 1. Стенд щойно перемкнув слайд на нового фіналіста.
          // Повертаємо видимість текстам і скасовуємо попередній таймер.
          if (attractName) attractName.style.opacity = '1';
          if (attractKind) attractKind.style.opacity = '1';
          if (attractHeading) attractHeading.style.opacity = '1';
          clearTimeout(attractTimeout);

          // Якщо фотографій з події ще немає - просто виходимо
          if (!window.eventPhotosArray || window.eventPhotosArray.length === 0) return;

          // 2. Запускаємо таймер. Через 4 секунди показу фіналіста
          // ми підміняємо картинку на фото з події і ховаємо текст.
          attractTimeout = setTimeout(() => {
              isOurMutation = true;
              const randomIdx = Math.floor(Math.random() * window.eventPhotosArray.length);
              attractImage.src = window.eventPhotosArray[randomIdx].url;
              
              if (attractName) attractName.style.opacity = '0';
              if (attractKind) attractKind.style.opacity = '0';
              if (attractHeading) attractHeading.style.opacity = '0';

              setTimeout(() => { isOurMutation = false; }, 50);
          }, 4000); // 4000 мілісекунд (4 сек). Якщо слайди міняються занадто швидко, можна зменшити до 3000.
      });

      attractObserver.observe(attractImage, { attributes: true, attributeFilter: ['src'] });
      
      // Зупиняємо таймер, якщо екран торкнулися і заставка зникла
      const attractPanel = document.querySelector('[data-attract]');
      if (attractPanel) {
          const panelObserver = new MutationObserver((mutations) => {
              mutations.forEach(mutation => {
                  if (mutation.attributeName === 'hidden' && attractPanel.hasAttribute('hidden')) {
                      clearTimeout(attractTimeout);
                  }
              });
          });
          panelObserver.observe(attractPanel, { attributes: true });
      }
  }

  fetchPhotos();
  setInterval(fetchPhotos, 60000); 

});

// 6. НАВІГАЦІЯ В ЛАЙТБОКСІ
document.addEventListener('DOMContentLoaded', () => {
    const prevBtn = document.querySelector('[data-photo-step="-1"]');
    const nextBtn = document.querySelector('[data-photo-step="1"]');
    
    const navigateLightbox = (step) => {
        if(!window.currentLightboxArray || window.currentLightboxArray.length === 0) return;
        
        let newIndex = window.currentLightboxIndex + step;
        const maxIndex = window.currentLightboxArray.length - 1;
        
        if(newIndex < 0) newIndex = maxIndex;
        if(newIndex > maxIndex) newIndex = 0;
        
        const photo = window.currentLightboxArray[newIndex];
        const lightbox = document.querySelector('[data-event-lightbox]');
        const image = document.querySelector('[data-event-image]');
        const countDisplay = lightbox.querySelector('[data-photo-count]');
        
        window.currentLightboxIndex = newIndex;
        image.src = photo.url;
        if(countDisplay) countDisplay.textContent = `${newIndex + 1} з ${window.currentLightboxArray.length}`;
    };

    if(prevBtn) prevBtn.addEventListener('click', () => navigateLightbox(-1));
    if(nextBtn) nextBtn.addEventListener('click', () => navigateLightbox(1));
});
</script>
