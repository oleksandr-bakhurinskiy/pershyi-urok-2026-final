name = "pershyi-urok-support"
main = "worker.mjs"
compatibility_date = "2026-11-11"

[vars]
# Only the origin, without repository path or trailing slash.
ALLOWED_ORIGIN = "https://YOUR_ACCOUNT.github.io"

[[durable_objects.bindings]]
name = "SUPPORT"
class_name = "Support"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Support"]

# Set secrets separately with wrangler secret put:
# TELEGRAM_BOT_TOKEN, KIOSK_DEVICE_KEY, KIOSK_TEST_CHAT_ID,
# KIOSK_TEST_STICKER_ID, KIOSK_RECIPIENTS_JSON, KIOSK_STICKERS_JSON
